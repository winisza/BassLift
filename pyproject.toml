# Konfiguracja budowania BassLift.app (Briefcase). Budowa: scripts/build_macos_app.sh
# Zależności aplikacji są w requirements.txt — lista `requires` niżej musi się z nią zgadzać
# (pilnuje tego tests/test_packaging.py).

[tool.briefcase]
project_name = "BassLift"
bundle = "io.github.winisza"
version = "0.4.0"
url = "https://github.com/winisza/BassLift"
license = "MIT"
license-files = ["LICENSE"]
author = "winisza"

[tool.briefcase.app.basslift]
formal_name = "BassLift"
description = "Bass line extraction, transcription and tablature"
long_description = "Separates the bass from a song, transcribes it to notes and writes a 4-string bass tab, MIDI and MusicXML. Runs fully locally."
sources = ["basslift", "server.py", "web_gui.html", "logo", "fonts"]
icon = "build/icons/basslift"   # generowana przez scripts/build_macos_app.sh z logo/
requires = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "python-multipart>=0.0.9",
    "demucs>=4.1.0",
    "librosa>=0.10.1",
    "numpy>=1.24",
    "midiutil>=1.2.1",
    "torchcrepe>=0.0.23",
    "beat_this>=1.1.0",
    "audio-separator>=0.47",
    "onnxruntime>=1.20",
    "imageio-ffmpeg>=0.5",
    "audioread>=3.0",
    "pywebview>=5.0",
]

[tool.briefcase.app.basslift.macOS]
universal_build = false      # PyTorch nie ma już kół x86_64 dla macOS — tylko Apple Silicon
min_os_version = "14.0"      # koła torch 2.14 wymagają macOS 14+
# koła zbudowane lokalnie przez scripts/build_macos_app.sh (pakiety bez gotowych kół)
requirement_installer_args = ["--find-links", "build/wheelhouse"]
cleanup_paths = [
    # ~200 MB, niepotrzebne w działającej aplikacji
    "**/app_packages/torch/include",
    "**/app_packages/**/tests",
    "**/app_packages/onnx/backend/test",
]
